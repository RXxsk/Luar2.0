name: Publicador Automático
on:
  repository_dispatch:
    types: [nueva_publicacion]

jobs:
  crear-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Crear archivo HTML
        run: |
          # Extraemos los datos enviados desde Vercel
          TITULO="${{ github.event.client_payload.titulo }}"
          CONTENIDO="${{ github.event.client_payload.texto }}"
          
          # Creamos un nombre de archivo amigable (slug)
          FILENAME="posts/$(echo $TITULO | tr '[:upper:]' '[:lower:]' | tr ' ' '-').html"
          
          # Plantilla del post
          echo "<html><head><title>$TITULO</title><link rel='stylesheet' href='../style.css'></head><body>" > $FILENAME
          echo "<h1>$TITULO</h1><p>$CONTENIDO</p><a href='../index.html'>Volver</a>" >> $FILENAME
          echo "</body></html>" >> $FILENAME

      - name: Subir cambios a GitHub
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Nuevo post: ${{ github.event.client_payload.titulo }}"
          git push
          
